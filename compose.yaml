x-otel-app-env: &otel-app-env
  GOCHAT_DEPLOYMENT_ENV: docker-compose
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

x-go-service-logging: &go-service-logging
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async: "true"
    tag: "{{.Name}}"

services:

# ---------- Application services ----------

  auth:
    image: gochat/auth
    build:
      dockerfile: auth.Dockerfile
    restart: always
    logging: *go-service-logging
    environment: *otel-app-env
    volumes:
      - ./auth_config.yaml:/dist/config.yaml
      - ./email_notify.tmpl:/dist/email_notify.tmpl
      - ./password_reset.tmpl:/dist/password_reset.tmpl
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.auth.service=auth"
      - "traefik.http.services.auth.loadbalancer.server.port=3100"
      - "traefik.docker.network=gochat_traefik"
    depends_on:
      keydb:
        condition: service_started
      citus-master:
        condition: service_started
    networks:
      - traefik
      - default

  api:
    image: gochat/api
    build:
      dockerfile: api.Dockerfile
    restart: always
    logging: *go-service-logging
    environment: *otel-app-env
    volumes:
      - ./api_config.yaml:/dist/config.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api/v1`)"
      - "traefik.http.routers.api.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=3100"
      - "traefik.docker.network=gochat_traefik"
    depends_on:
      scylla:
        condition: service_healthy
      keydb:
        condition: service_started
      nats:
        condition: service_started
      auth:
        condition: service_started
    networks:
      - traefik
      - default

  attachments:
    image: gochat/attachments
    build:
      dockerfile: attachments.Dockerfile
    restart: always
    logging: *go-service-logging
    environment: *otel-app-env
    volumes:
      - ./attachments_config.yaml:/dist/config.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.attachments.rule=PathPrefix(`/api/v1/upload`) || PathPrefix(`/emoji`)"
      - "traefik.http.routers.attachments.priority=100"
      - "traefik.http.routers.attachments.service=attachments"
      - "traefik.http.services.attachments.loadbalancer.server.port=3200"
      - "traefik.docker.network=gochat_traefik"
    depends_on:
      scylla:
        condition: service_healthy
      keydb:
        condition: service_started
      nats:
        condition: service_started
      auth:
        condition: service_started
    networks:
      - traefik
      - default

  ws:
    image: gochat/ws
    build:
      dockerfile: ws.Dockerfile
    restart: always
    logging: *go-service-logging
    environment: *otel-app-env
    volumes:
      - ./ws_config.yaml:/dist/config.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.middlewares=ws-stripprefix"
      - "traefik.http.middlewares.ws-stripprefix.stripprefix.prefixes=/ws"
      - "traefik.http.middlewares.ws-stripprefix.stripprefix.forceslash=true"
      - "traefik.http.routers.ws.service=ws"
      - "traefik.http.services.ws.loadbalancer.server.port=3100"
      - "traefik.docker.network=gochat_traefik"
    depends_on:
      nats:
        condition: service_started
    networks:
      - traefik
      - default

  webhook:
    image: gochat/webhook
    build:
      dockerfile: webhook.Dockerfile
    restart: always
    logging: *go-service-logging
    environment: *otel-app-env
    volumes:
      - ./webhook_config.yaml:/dist/config.yaml
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webhook.rule=PathPrefix(`/api/v1/webhook`)"
      - "traefik.http.routers.webhook.priority=100"
      - "traefik.http.routers.webhook.service=webhook"
      - "traefik.http.services.webhook.loadbalancer.server.port=3200"
      - "traefik.docker.network=gochat_traefik"
    depends_on:
      - traefik
    networks:
      - traefik
      - default

  indexer:
    image: gochat/indexer
    build:
      dockerfile: indexer.Dockerfile
    restart: always
    logging: *go-service-logging
    environment: *otel-app-env
    volumes:
      - ./indexer_config.yaml:/dist/config.yaml
    depends_on:
      indexer-nats:
        condition: service_started
      opensearch:
        condition: service_started

  embedder:
    image: gochat/embedder
    build:
      dockerfile: embedder.Dockerfile
    restart: always
    logging: *go-service-logging
    environment: *otel-app-env
    volumes:
      - ./embedder_config.yaml:/dist/config.yaml
    depends_on:
      scylla:
        condition: service_healthy
      nats:
        condition: service_started
      keydb:
        condition: service_started

  # ---------- Environment services ----------
  scylla:
    image: scylladb/scylla:6.2
    volumes:
      - scylla-data:/var/lib/scylla
      - ./init/init-scylladb.sh:/init-scylladb.sh
    ports:
      - "7000:7000"
      - "9042:9042"
      - "7199:7199"
    environment:
      - SCYLLA_DEVELOPER_MODE=1
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT now() FROM system.local;"]
      interval: 10s
      retries: 5
    restart: always

  nats:
    image: nats:2.10.22-alpine3.20
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    restart: always

  indexer-nats:
    image: nats:2.10.22-alpine3.20
    ports:
      - "4333:4222"
      - "8333:8222"
      - "6333:6222"
    restart: always

  keydb:
    image: eqalpha/keydb:alpine
    ports:
      - "6379:6379"
    restart: always

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=CustOM-Pa55w0Rd
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch

  traefik:
    image: traefik:v3.4
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=120s"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=0s"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=0s"
      - "--serversTransport.forwardingTimeouts.idleConnTimeout=120s"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik

  openobserve:
    image: openobserve/openobserve:latest
    restart: always
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
    volumes:
      - openobserve-data:/data
    ports:
      - "5080:5080"

  telemetry-gateway:
    image: gochat/telemetry-gateway
    build:
      dockerfile: telemetry-gateway.Dockerfile
    restart: always
    environment: *otel-app-env
    depends_on:
      otel-collector:
        condition: service_started
    volumes:
      - ./telemetry_gateway_config.yaml:/dist/config.yaml
    ports:
      - "4318:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    environment:
      OPENOBSERVE_ORG: default
      OPENOBSERVE_BASIC_AUTH: cm9vdEBleGFtcGxlLmNvbTpDb21wbGV4cGFzcyMxMjM=
      OPENOBSERVE_LOG_STREAM: gochat_logs
      OPENOBSERVE_METRIC_STREAM: gochat-metrics
      OPENOBSERVE_TRACE_STREAM: gochat_traces
    depends_on:
      openobserve:
        condition: service_started
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "13133:13133"
      - "24224:24224"

  citus-master:
    container_name: "${COMPOSE_PROJECT_NAME:-citus}_master"
    image: "citusdata/citus:13.0.3"
    ports: [ "${COORDINATOR_EXTERNAL_PORT:-5432}:5432" ]
    labels: [ "com.citusdata.role=Master" ]
    environment: &AUTH
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      PGUSER: "${POSTGRES_USER:-postgres}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_HOST_AUTH_METHOD: "${POSTGRES_HOST_AUTH_METHOD:-trust}"
      POSTGRES_DB: "gochat"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -d gochat -U ${POSTGRES_USER:-postgres} --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - master
      citus:
        aliases:
          - master
  citus-worker:
    image: "citusdata/citus:13.0.3"
    labels: [ "com.citusdata.role=Worker" ]
    depends_on: [ citus-manager ]
    environment: *AUTH
    command: "/wait-for-manager.sh"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-postgres} --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - healthcheck-volume:/healthcheck
    networks:
      - default
      - citus
  citus-manager:
    container_name: "${COMPOSE_PROJECT_NAME:-citus}_manager"
    image: "citusdata/membership-manager:0.3.0"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
      - healthcheck-volume:/healthcheck
    depends_on: [ citus-master ]
    environment: *AUTH
    networks:
      default:
        aliases:
          - manager
      citus:
        aliases:
          - manager

  citus-init:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      citus-master:
        condition: service_started
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
    entrypoint: ["/bin/sh", "-c", "until pg_isready -h citus-master -p 5432 -U ${POSTGRES_USER:-postgres}; do sleep 1; done; psql -h citus-master -U ${POSTGRES_USER:-postgres} -d gochat -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS citus;'" ]
    networks:
      - citus

  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=no
      - ETCD_ROOT_PASSWORD=${ETCD_ROOT_PASSWORD:-changeme}
      - ETCD_ENABLE_V2=false
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_NAME=etcd

volumes:
  scylla-data:
  openobserve-data:
  opensearch-data:
  healthcheck-volume:

networks:
  traefik:
    name: gochat_traefik
  citus:
    name: gochat_citus


