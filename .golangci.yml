version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - contextcheck
    - errcheck
    - exhaustruct
    - govet
    - noctx
    - revive
    - staticcheck
  settings:
    revive:
      rules:
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: if-return
        - name: indent-error-flow
        - name: context-as-argument
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - exhaustruct
          - noctx
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: true

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
