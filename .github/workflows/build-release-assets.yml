name: Build Release Images

# Trigger when a release is published
on:
  release:
    types: [published]

permissions:
  contents: write # Need write to upload assets to a release
  packages: write # Needed to push container images to GHCR

jobs:
  build-images:
    name: Build and Push ${{ matrix.service }} Release Image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: api.Dockerfile
            image: gochat-api
            cache_scope: api-release
          - service: ws
            dockerfile: ws.Dockerfile
            image: gochat-ws
            cache_scope: ws-release
          - service: auth
            dockerfile: auth.Dockerfile
            image: gochat-auth
            cache_scope: auth-release
          - service: indexer
            dockerfile: indexer.Dockerfile
            image: gochat-indexer
            cache_scope: indexer-release
          - service: embedder
            dockerfile: embedder.Dockerfile
            image: gochat-embedder
            cache_scope: embedder-release
          - service: attachments
            dockerfile: attachments.Dockerfile
            image: gochat-attachments
            cache_scope: attachments-release
          - service: search
            dockerfile: search.Dockerfile
            image: gochat-search
            cache_scope: search-release
          - service: webhook
            dockerfile: webhook.Dockerfile
            image: gochat-webhook
            cache_scope: webhook-release
          - service: telemetry-gateway
            dockerfile: telemetry-gateway.Dockerfile
            image: gochat-telemetry-gateway
            cache_scope: telemetry-gateway-release
          - service: sfu
            dockerfile: sfu.Dockerfile
            image: gochat-sfu
            cache_scope: sfu-release
          - service: stream
            dockerfile: stream.Dockerfile
            image: gochat-stream
            cache_scope: stream-release
          - service: migrations
            dockerfile: migration.Dockerfile
            image: gochat-migrations
            cache_scope: migrations-release
    steps:
      # Checkout the specific tag associated with the release
      - name: Check out code at specific tag
        uses: actions/checkout@v6
        with:
          # github.ref is the tag name for release events (e.g., refs/tags/v1.0.0)
          ref: ${{ github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Uses the workflow's GITHUB_TOKEN

      - name: Extract metadata for ${{ matrix.service }} image
        id: meta_release
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            # Always tag as latest on release
            type=raw,value=latest,enable=true

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: . # Build context is the repository root
          file: ./${{ matrix.dockerfile }} # Dockerfile is in the root
          push: true
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  build-binaries:
    name: Build and Upload Release Binaries
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Check out code at tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build SFU, Stream and Tools binaries (linux/amd64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -o dist/sfu_linux_amd64 ./cmd/sfu
          go build -o dist/stream_linux_amd64 ./cmd/stream
          go build -o dist/gctools_linux_amd64 ./cmd/tools

      - name: Build SFU, Stream and Tools binaries (linux/arm64)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -o dist/sfu_linux_arm64 ./cmd/sfu
          go build -o dist/stream_linux_arm64 ./cmd/stream
          go build -o dist/gctools_linux_arm64 ./cmd/tools

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/sfu_linux_amd64
            dist/sfu_linux_arm64
            dist/stream_linux_amd64
            dist/stream_linux_arm64
            dist/gctools_linux_amd64
            dist/gctools_linux_arm64
            dist/SHA256SUMS.txt
